<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="min-h-210 flex justify-center items-center bg-[#E8DCC5]">
    <main class="flex justify-center items-center border-radius">
        <div class="p-8 rounded-2xl shadow-2xl shadow-black-200/50">
            <h1 class="mb-7 text-4xl text-[#6B513B] font-bold">Danm Notes</h1>
            <div class="max-w-100 w-full">
                <form action="/auth/login" class="" id="loginForm" method="POST">
                    <div class="mb-3">
                        <label for="username" class="text-lg">Username</label><br>
                        <input autocomplete="off" autofocus class="px-1 min-w-full h-9 border rounded-sm" id="username" name="username" type="text"><br>
                        <div class="text-sm text-gray-600">Your username must be unique.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="">Password</label><br>
                        <input autocomplete="off" class="px-1 min-w-full h-9 border rounded-sm" id="password" name="password" type="password"><br>
                        <div class="text-sm text-gray-600">Your password must be 8 - 20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.</div>
                    </div>
                    <button class="cursor-pointer inline-flex p-2 rounded-sm bg-[#B89B72] hover:bg-[#6B513B] transition-colors duration-200" type="submit">Log In</button>
                    <a href="/auth/register" class="inline-flex p-2 rounded-sm bg-gray-400 hover:bg-gray-500">Register</a>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
