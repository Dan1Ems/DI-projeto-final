<section>
    <div class="flex items-center justify-between mb-6 mx-2">

        <h2 class="text-4xl text-[#6B513B] font-bold">
            My Notes
        </h2>

        <button type="button" id="create-note-btn" class="cursor-pointer flex items-center gap-2 px-4 py-2 rounded-md bg-[#526B45] text-[#E8DCC5] hover:bg-[#657A50] transition-colors duration-200">
            <i data-lucide="plus"></i>
            <span>CREATE NOTE</span>
        </button>
    </div>
    <template id="note-template">
        <div class="note-card m-2 p-4 cursor-pointer border border-[#B89B72] hover:bg-[#B89B72] transition-colors duration-200 rounded-md flex items-center gap-2">
            <button type="button" class="note-title flex flex-row gap-2 w-full h-full cursor-pointer">
                <i data-lucide="notebook" class="text-[#6B513B]"></i>
                <span class="note-title-text text-[#6B513B]"></span>
            </button>

            <button type="button" class="note-btn-update">
                <span>UPDATE</span>
            </button>

            <button type="button" class="note-btn-delete">
                <span>DELETE</span>
            </button>
        </div>
    </template>

    <div id="notes-container"></div>

    <div id="edit-note-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <form id="edit-note-form" class="bg-[#E8DCC5] p-6 rounded-md w-11/12 max-w-lg">
            <h2 class="text-2xl font-bold text-[#6B513B] mb-4">Edit Note</h2>

            <input type="hidden" id="edit-note-id">

            <label for="edit-note-title">Title</label>
            <input id="edit-note-title" type="text" required
                class="w-full p-2 mb-4 rounded border border-[#6B513B]">

            <label for="edit-note-text">Content</label>
            <textarea id="edit-note-text" required
                class="w-full p-2 mb-4 rounded border border-[#6B513B]"></textarea>

            <div class="flex justify-end gap-2">
                <button type="button" id="cancel-edit"
                    class="px-4 py-2 rounded border border-[#6B513B]">
                    CANCEL
                </button>

                <button type="submit"
                    class="px-4 py-2 rounded bg-[#6B513B] text-[#E8DCC5]">
                    SAVE
                </button>
            </div>
        </form>
    </div>
    <div id="create-note-modal"
    class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

    <form id="create-note-form"
        class="bg-[#E8DCC5] p-6 rounded-md w-11/12 max-w-lg">

        <h2 class="text-2xl font-bold text-[#6B513B] mb-4">
            Create Note
        </h2>

        <label for="create-note-title">Title</label>
        <input
            id="create-note-title"
            type="text"
            required
            class="w-full p-2 mb-4 rounded border border-[#6B513B]"
        >

        <label for="create-note-text">Content</label>
        <textarea
            id="create-note-text"
            required
            class="w-full p-2 mb-4 rounded border border-[#6B513B]"
        ></textarea>

        <div class="flex justify-end gap-2">
            <button
                type="button"
                id="cancel-create"
                class="px-4 py-2 rounded border border-[#6B513B]"
            >
                CANCEL
            </button>

            <button
                type="submit"
                class="px-4 py-2 rounded bg-[#526B45] text-[#E8DCC5]"
            >
                CREATE
            </button>
        </div>
    </form>
</section>
