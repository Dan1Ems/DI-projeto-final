<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>

    <link href="/css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <form action="/auth/register" class="w-100 px-3 register-form" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input autocomplete="off" autofocus class="form-control" id="username" name="username" type="text" aria-describedby="usernameHelp">
                    <div id="usernameHelp" class="form-text">Your username must be unique.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input autocomplete="off" class="form-control" id="password" name="password" type="password" aria-describedby="passwordHelp">
                    <div id="passwordHelp" class="form-text">Your password must be 8 - 20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Confirm Password</label>
                    <input autocomplete="off" class="form-control" id="confirmPassword" name="confirmPassword" type="password" aria-describedby="confirmPasswordHelp">
                    <div id="confirmPasswordHelp" class="form-text">Must be identical to password</div>
                </div>
                <button class="btn btn-primary" type="submit">Register</button>
            </form>
        </div>
    </main>
</body>
</html>
